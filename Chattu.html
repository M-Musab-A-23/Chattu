<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chattu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📹</text></svg>" />

    <!-- React & PeerJS -->
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* Minimalist "Orange & Black" Theme from Slide */
      body {
        background-color: #000000;
        color: #ffffff;
        font-family: "Inter", sans-serif;
      }
      .accent-text {
        color: #ff5722;
      } /* Deep Orange */
      .accent-bg {
        background-color: #ff5722;
      }
      .accent-border {
        border-color: #ff5722;
      }

      .video-wrapper {
        transition: all 0.5s ease;
      }
      /* Loading Spinner */
      .loader {
        border: 4px solid #333;
        border-top: 4px solid #ff5722;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      
      /* Caption animations */
      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .caption-animate {
        animation: fadeSlideIn 0.3s ease-out;
      }
      
      .caption-text {
        word-break: break-word;
        hyphens: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- MILESTONE 1: RELIABLE AV CONFIG ---
      const MEDIA_CONSTRAINTS = {
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: "user",
        },
        audio: { echoCancellation: true, noiseSuppression: true },
      };

      const App = () => {
        const [myId, setMyId] = useState("");
        const [status, setStatus] = useState("initializing"); // initializing, idle, connecting, connected, error, auto-joining
        const [remoteIdInput, setRemoteIdInput] = useState("");
        const [errorMsg, setErrorMsg] = useState("");
        const [copySuccess, setCopySuccess] = useState(false);
        
        // --- MILESTONE 2: CAPTIONS STATE ---
        const [localCaption, setLocalCaption] = useState("");
        const [remoteCaption, setRemoteCaption] = useState("");
        const [captionsEnabled, setCaptionsEnabled] = useState(true);

        const localVideoRef = useRef(null);
        const remoteVideoRef = useRef(null);
        const peerRef = useRef(null);
        const currentCallRef = useRef(null);
        const isAutoJoining = useRef(false);
        const localStreamRef = useRef(null); // Store stream reference
        const remoteStreamRef = useRef(null); // Store remote stream reference
        
        // --- MILESTONE 2: SPEECH RECOGNITION ---
        const recognitionRef = useRef(null);
        const dataConnectionRef = useRef(null); // For sending captions

        // --- 1. INITIALIZATION & RELIABLE SETUP ---
        useEffect(() => {
          const peer = new Peer({ debug: 2 });

          peer.on("open", (id) => {
            setMyId(id);

            // --- MAGIC LINK LOGIC ---
            // Check if we were invited via URL
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get("call");

            if (targetId) {
              // We are the guest
              setStatus("auto-joining");
              setRemoteIdInput(targetId);
              isAutoJoining.current = true;
              // Slight delay to ensure PeerJS is fully ready
              setTimeout(() => startCall(targetId, peer), 1000);
            } else {
              // We are the host
              setStatus("idle");
            }
          });

          peer.on("call", handleIncomingCall);

          peer.on("error", (err) => {
            console.error(err);
            setStatus("error");
            if (err.type === "peer-unavailable")
              setErrorMsg("User not found. They might have closed the tab.");
            else setErrorMsg("Connection error. Please refresh.");
          });

          peer.on("disconnected", () => {
            // Only show disconnected if we aren't in error state
            if (status !== "error") {
              setStatus("disconnected");
              peer.reconnect();
            }
          });

          peerRef.current = peer;
          return () => peer.destroy();
        }, []);

        // --- MILESTONE 2: INITIALIZE SPEECH RECOGNITION ---
        useEffect(() => {
          if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            console.warn("Speech recognition not supported");
            return;
          }

          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          const recognition = new SpeechRecognition();
          
          recognition.continuous = true;
          recognition.interimResults = true;
          
          // Let speech recognition auto-detect the spoken language
          // This detects actual speech, not browser settings
          // Supports multiple languages: English, Urdu, Arabic, Hindi, etc.
          recognition.lang = ''; // Empty means auto-detect from speech
          recognition.maxAlternatives = 3;
          
          console.log('🌍 Speech recognition set to auto-detect spoken language');

          let finalSentences = [];

          recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              
              if (event.results[i].isFinal) {
                // This is a complete sentence
                finalTranscript += transcript;
                finalSentences.push(transcript);
                
                // Keep only last 3 sentences
                if (finalSentences.length > 3) {
                  finalSentences.shift();
                }
                
                console.log('📝 Final transcript:', transcript);
              } else {
                // Still being spoken
                interimTranscript += transcript;
              }
            }

            // Combine final sentences with current interim
            const displayText = [...finalSentences, interimTranscript].filter(t => t.trim()).join(' ');
            setLocalCaption(displayText);

            // Always send to keep connection alive and ensure continuous captions
            if (dataConnectionRef.current && dataConnectionRef.current.open) {
              try {
                dataConnectionRef.current.send({
                  type: 'caption',
                  text: displayText || ' ', // Send space if empty to keep connection alive
                  isFinal: !!finalTranscript,
                  timestamp: Date.now()
                });
                console.log('📤 Sent caption:', displayText.substring(0, 50) + '...');
              } catch (e) {
                console.error('Failed to send caption:', e);
              }
            } else {
              console.warn('⚠️ Data connection not open, cannot send caption');
            }
          };

          recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            if (event.error === 'no-speech') {
              // Restart if no speech detected
              setTimeout(() => {
                if (status === 'connected' && captionsEnabled) {
                  try {
                    recognition.start();
                  } catch (e) {
                    // Already running
                  }
                }
              }, 100);
            }
          };

          recognition.onend = () => {
            // Auto-restart if still connected
            if (status === 'connected' && captionsEnabled) {
              setTimeout(() => {
                try {
                  recognition.start();
                  console.log('🎤 Speech recognition restarted');
                } catch (e) {
                  // Already running
                }
              }, 100);
            }
          };

          recognitionRef.current = recognition;

          return () => {
            if (recognitionRef.current) {
              try {
                recognitionRef.current.stop();
              } catch (e) {
                // Already stopped
              }
            }
          };
        }, []);

        // Start/stop speech recognition based on connection status
        useEffect(() => {
          if (status === 'connected' && captionsEnabled && recognitionRef.current) {
            try {
              recognitionRef.current.start();
              console.log('🎤 Speech recognition started');
            } catch (e) {
              console.warn('Speech recognition already started or error:', e);
            }
          } else if (status !== 'connected' && recognitionRef.current) {
            try {
              recognitionRef.current.stop();
              console.log('🎤 Speech recognition stopped');
              setLocalCaption(''); // Clear captions when disconnected
            } catch (e) {
              // Already stopped
            }
          }
        }, [status, captionsEnabled]);

        // Attach streams when status changes to connected
        useEffect(() => {
          if (status === "connected") {
            console.log("📺 Status changed to connected, attaching streams to display elements");
            console.log("Local stream ref:", localStreamRef.current);
            console.log("Remote stream ref:", remoteStreamRef.current);
            
            // Wait for React to render the video elements
            setTimeout(() => {
              // Attach local stream
              const localDisplay = document.getElementById('localVideoDisplay');
              console.log("Local display element:", localDisplay);
              if (localDisplay && localStreamRef.current) {
                console.log("🎥 Attaching local stream to display");
                localDisplay.srcObject = localStreamRef.current;
                localDisplay.muted = true;
                localDisplay.play().catch(e => console.error("Local display play error:", e));
              } else {
                console.warn("⚠️ Missing local display or stream:", { localDisplay, stream: localStreamRef.current });
              }
              
              // Attach remote stream
              const remoteDisplay = document.getElementById('remoteVideoDisplay');
              console.log("Remote display element:", remoteDisplay);
              if (remoteDisplay && remoteStreamRef.current) {
                console.log("🎥 Attaching remote stream to display");
                console.log("Remote stream tracks:", remoteStreamRef.current.getTracks());
                remoteDisplay.srcObject = remoteStreamRef.current;
                remoteDisplay.muted = false;
                remoteDisplay.volume = 1.0;
                
                // Try to play
                const playPromise = remoteDisplay.play();
                if (playPromise !== undefined) {
                  playPromise
                    .then(() => console.log("✅ Remote video playing successfully"))
                    .catch((e) => {
                      console.warn("⚠️ Autoplay blocked, showing click overlay");
                      
                      // Remove any existing overlay
                      const existingOverlay = document.getElementById('click-overlay');
                      if (existingOverlay) existingOverlay.remove();
                      
                      // Create overlay
                      const overlay = document.createElement('div');
                      overlay.id = 'click-overlay';
                      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;';
                      overlay.innerHTML = '<div style="color:white;text-align:center;font-size:24px;"><p>🎥 Click anywhere to start video & audio</p><p style="font-size:16px;margin-top:10px;color:#ff5722;">Browser requires user interaction</p></div>';
                      
                      overlay.onclick = () => {
                        console.log("🖱️ User clicked overlay");
                        const remote = document.getElementById('remoteVideoDisplay');
                        if (remote && remote.srcObject) {
                          remote.play()
                            .then(() => {
                              console.log("✅ Video playing after user click");
                              overlay.remove();
                            })
                            .catch(err => {
                              console.error("❌ Still can't play:", err);
                              alert("Error playing video. Please refresh and try again.");
                            });
                        } else {
                          console.error("❌ No video element or stream found");
                        }
                      };
                      
                      document.body.appendChild(overlay);
                    });
                }
              } else {
                console.error("❌ Missing remote display or stream:", { remoteDisplay, stream: remoteStreamRef.current });
              }
            }, 200);
          }
        }, [status]);

        // --- 2. LOGIC: HANDLE INCOMING CALL ---
        const handleIncomingCall = (call) => {
          console.log("📞 Incoming call received");
          setStatus("connecting");
          
          // Get media first, THEN change status to connected
          navigator.mediaDevices
            .getUserMedia(MEDIA_CONSTRAINTS)
            .then((stream) => {
              console.log("✅ Local stream started:", stream.getTracks());
              console.log("Audio tracks:", stream.getAudioTracks());
              console.log("Video tracks:", stream.getVideoTracks());
              
              localStreamRef.current = stream;
              
              if (localVideoRef.current) {
                localVideoRef.current.srcObject = stream;
                localVideoRef.current.muted = true;
                localVideoRef.current.play().catch(e => console.error("Local play error:", e));
              }
              
              console.log("📤 Answering call with stream");
              call.answer(stream);
              setupCallEventHandlers(call);
              
              // --- MILESTONE 2: SETUP DATA CONNECTION FOR CAPTIONS (Answerer) ---
              setupDataConnection(call.peer);
            })
            .catch((err) => handleMediaError(err));
        };

        // --- 3. LOGIC: START OUTGOING CALL ---
        // Modified to accept arguments for auto-joining
        const startCall = (
          targetId = remoteIdInput,
          peerInstance = peerRef.current
        ) => {
          if (!targetId || !peerInstance) return;
          console.log("📞 Starting call to:", targetId);
          setStatus("connecting");

          navigator.mediaDevices
            .getUserMedia(MEDIA_CONSTRAINTS)
            .then((stream) => {
              console.log("✅ Outgoing call - local stream:", stream.getTracks());
              console.log("Audio tracks:", stream.getAudioTracks());
              console.log("Video tracks:", stream.getVideoTracks());
              
              localStreamRef.current = stream;
              
              if (localVideoRef.current) {
                localVideoRef.current.srcObject = stream;
                localVideoRef.current.muted = true;
                localVideoRef.current.play().catch(e => console.error("Local play error:", e));
              }
              
              // Sync to display when connected
              const syncLocalDisplay = () => {
                const displayVideo = document.getElementById('localVideoDisplay');
                if (displayVideo) {
                  displayVideo.srcObject = stream;
                  displayVideo.play().catch(e => console.error("Display play error:", e));
                }
              };
              setTimeout(syncLocalDisplay, 100);

              console.log("📤 Calling peer with stream");
              const call = peerInstance.call(targetId, stream);
              setupCallEventHandlers(call);
              
              // --- MILESTONE 2: SETUP DATA CONNECTION FOR CAPTIONS (Caller) ---
              setupDataConnection(targetId);
            })
            .catch((err) => handleMediaError(err));
        };

        const setupCallEventHandlers = (call) => {
          console.log("🔧 Setting up call event handlers");
          
          call.on("stream", (remoteStream) => {
            console.log("📥 Remote stream received!");
            console.log("Remote tracks:", remoteStream.getTracks());
            console.log("Remote audio tracks:", remoteStream.getAudioTracks());
            console.log("Remote video tracks:", remoteStream.getVideoTracks());
            
            // Store the stream
            remoteStreamRef.current = remoteStream;
            
            // Attach to hidden ref video
            if (remoteVideoRef.current) {
              console.log("🎥 Attaching remote stream to ref video element");
              remoteVideoRef.current.srcObject = remoteStream;
              remoteVideoRef.current.muted = false;
              remoteVideoRef.current.volume = 1.0;
              remoteVideoRef.current.play().catch(e => console.error("Ref play error:", e));
            }
            
            // Change status to connected (this will render the video elements)
            setStatus("connected");
          });

          call.on("close", () => {
            console.log("📴 Call closed");
            setStatus("idle");
            if (remoteVideoRef.current) remoteVideoRef.current.srcObject = null;
            if (localVideoRef.current && localVideoRef.current.srcObject) {
              localVideoRef.current.srcObject.getTracks().forEach(t => t.stop());
              localVideoRef.current.srcObject = null;
            }
            alert("Call ended by remote user.");
            window.history.replaceState(
              {},
              document.title,
              window.location.pathname
            );
          });

          call.on("error", (e) => {
            console.error("❌ Call error:", e);
            setStatus("error");
            setErrorMsg("Call error: " + e.message);
          });

          currentCallRef.current = call;
        };

        // --- MILESTONE 2: SETUP DATA CONNECTION FOR CAPTIONS ---
        const setupDataConnection = (peerId) => {
          if (!peerRef.current) return;

          console.log('📡 Setting up data connection to:', peerId);

          // Create data connection
          const conn = peerRef.current.connect(peerId, {
            reliable: true
          });
          
          conn.on('open', () => {
            console.log('✅ Data connection opened successfully');
            dataConnectionRef.current = conn;
          });

          conn.on('data', (data) => {
            console.log('📥 Received data:', data);
            if (data.type === 'caption') {
              setRemoteCaption(data.text);
              console.log('📝 Remote caption updated:', data.text);
            }
          });

          conn.on('close', () => {
            console.log('📡 Data connection closed');
            setRemoteCaption('');
          });

          conn.on('error', (err) => {
            console.error('❌ Data connection error:', err);
            // Retry connection after a delay
            setTimeout(() => {
              if (status === 'connected') {
                setupDataConnection(peerId);
              }
            }, 2000);
          });
        };

        // Handle incoming data connections from peer
        useEffect(() => {
          if (!peerRef.current) return;

          const handleConnection = (conn) => {
            console.log('📡 Incoming data connection from:', conn.peer);
            
            conn.on('open', () => {
              console.log('✅ Incoming data connection opened');
              // Store incoming connection (don't overwrite if we're also calling)
              if (!dataConnectionRef.current || !dataConnectionRef.current.open) {
                dataConnectionRef.current = conn;
              }
            });

            conn.on('data', (data) => {
              console.log('📥 Received data from peer:', data);
              if (data && data.type === 'caption') {
                const caption = data.text || '';
                setRemoteCaption(caption);
                console.log('📝 Remote caption updated (', caption.length, 'chars):', caption.substring(0, 50));
              }
            });

            conn.on('close', () => {
              console.log('📡 Incoming data connection closed');
              setRemoteCaption('');
            });

            conn.on('error', (err) => {
              console.error('❌ Incoming data connection error:', err);
              // Try to reconnect
              setTimeout(() => {
                if (status === 'connected' && conn.peer) {
                  console.log('🔄 Attempting to reconnect data channel...');
                }
              }, 1000);
            });
          };

          peerRef.current.on('connection', handleConnection);

          return () => {
            if (peerRef.current) {
              peerRef.current.off('connection', handleConnection);
            }
          };
        }, []);

        const handleMediaError = (err) => {
          console.error("❌ Media Error:", err);
          console.error("Error name:", err.name);
          console.error("Error message:", err.message);
          
          let errorMessage = "Could not access Camera/Mic. ";
          if (err.name === "NotAllowedError") {
            errorMessage += "Please allow camera and microphone permissions.";
          } else if (err.name === "NotFoundError") {
            errorMessage += "No camera or microphone found.";
          } else if (err.name === "NotReadableError") {
            errorMessage += "Camera/mic already in use by another app.";
          } else {
            errorMessage += err.message;
          }
          
          setErrorMsg(errorMessage);
          setStatus("error");
        };

        const endCall = () => {
          if (currentCallRef.current) currentCallRef.current.close();
          
          // Stop all tracks
          if (localStreamRef.current) {
            localStreamRef.current.getTracks().forEach((t) => t.stop());
            localStreamRef.current = null;
          }
          if (localVideoRef.current) {
            localVideoRef.current.srcObject = null;
          }
          if (remoteVideoRef.current) {
            remoteVideoRef.current.srcObject = null;
          }
          
          // --- MILESTONE 2: Cleanup captions ---
          if (recognitionRef.current) {
            try {
              recognitionRef.current.stop();
            } catch (e) {
              // Already stopped
            }
          }
          if (dataConnectionRef.current) {
            dataConnectionRef.current.close();
            dataConnectionRef.current = null;
          }
          setLocalCaption("");
          setRemoteCaption("");
          
          setStatus("idle");
          window.location.href = window.location.pathname;
        };

        // --- HELPERS ---
        const copyInviteLink = () => {
          const url = `${window.location.origin}${window.location.pathname}?call=${myId}`;
          navigator.clipboard.writeText(url);
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 2000);
        };

        // --- 4. RENDER ---
        return (
          <div className="h-screen w-screen flex flex-col items-center justify-center overflow-hidden relative">
            {/* Hidden video elements - always present for refs */}
            <video ref={localVideoRef} className="hidden" muted autoPlay playsInline />
            <video ref={remoteVideoRef} className="hidden" autoPlay playsInline />
            
            {/* STATUS BAR */}
            <div className="absolute top-6 left-6 z-20 flex items-center gap-3">
              <div
                className={`w-3 h-3 rounded-full ${
                  status === "connected" ? "bg-green-500" : "bg-red-500"
                } ${status !== "idle" ? "animate-pulse" : ""}`}
              ></div>
              <span className="text-sm font-mono tracking-widest uppercase text-gray-400">
                {status}
              </span>
            </div>

            {/* ERROR TOAST */}
            {status === "error" && (
              <div className="absolute top-20 bg-red-900/80 border border-red-500 text-white px-6 py-3 rounded z-50 backdrop-blur-sm">
                {errorMsg}
              </div>
            )}

            {/* MAIN INTERFACE */}
            {status === "connected" ? (
              <div className="relative w-full h-full bg-zinc-900">
                {/* Remote video - full screen */}
                <video
                  id="remoteVideoDisplay"
                  className="w-full h-full object-cover"
                  autoPlay
                  playsInline
                  controls={false}
                />
                
                {/* Label for remote video */}
                <div className="absolute top-4 right-4 bg-black/70 px-3 py-1 rounded text-white text-sm">
                  Remote User
                </div>

                {/* MILESTONE 2: Remote Captions (bottom of screen, doesn't block face) */}
                {captionsEnabled && remoteCaption && (
                  <div className="absolute bottom-20 left-0 right-0 px-4 md:px-8 z-20 caption-animate">
                    <div className="bg-black/90 backdrop-blur-md px-4 md:px-6 py-3 md:py-4 rounded-xl border-2 border-orange-500/70 shadow-2xl max-w-4xl mx-auto">
                      <div className="flex items-start gap-2">
                        <i data-lucide="message-square" className="w-5 h-5 text-orange-500 mt-1 flex-shrink-0"></i>
                        <p className="text-white text-left text-base md:text-lg leading-relaxed flex-1 caption-text">
                          {remoteCaption}
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {/* Local video - picture in picture */}
                <div className="absolute bottom-8 right-8 w-32 md:w-48 aspect-[9/16] md:aspect-video bg-black border border-gray-800 shadow-2xl rounded-lg overflow-hidden transition-all hover:scale-105">
                  <video
                    id="localVideoDisplay"
                    className="w-full h-full object-cover transform scale-x-[-1]"
                    muted
                    autoPlay
                    playsInline
                    controls={false}
                  />
                  {/* Label for local video */}
                  <div className="absolute top-2 right-2 bg-black/70 px-2 py-1 rounded text-white text-xs">
                    You
                  </div>
                  
                </div>
                
                {/* MILESTONE 2: Local Captions (top left, doesn't block face) */}
                {captionsEnabled && localCaption && (
                  <div className="absolute top-20 left-4 right-4 md:left-8 md:right-auto md:max-w-md z-10 caption-animate">
                    <div className="bg-black/90 backdrop-blur-md px-4 py-3 rounded-xl border-2 border-blue-500/70 shadow-2xl">
                      <div className="flex items-start gap-2">
                        <i data-lucide="mic" className="w-4 h-4 text-blue-400 mt-1 flex-shrink-0"></i>
                        <div className="flex-1">
                          <p className="text-blue-400 text-xs font-semibold mb-1">You</p>
                          <p className="text-white text-sm md:text-base leading-relaxed caption-text">{localCaption}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                <div className="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex gap-4">
                  {/* MILESTONE 2: Toggle Captions Button */}
                  <button
                    onClick={() => setCaptionsEnabled(!captionsEnabled)}
                    className={`${captionsEnabled ? 'bg-orange-600 hover:bg-orange-700' : 'bg-gray-600 hover:bg-gray-700'} text-white p-4 rounded-full shadow-lg transition-all transform hover:scale-110`}
                    title={captionsEnabled ? "Disable Captions" : "Enable Captions"}
                  >
                    <i data-lucide={captionsEnabled ? "captions" : "captions-off"}></i>
                  </button>
                  
                  <button
                    onClick={endCall}
                    className="bg-red-600 hover:bg-red-700 text-white p-4 rounded-full shadow-lg transition-all transform hover:scale-110"
                  >
                    <i data-lucide="phone-off"></i>
                  </button>
                </div>
              </div>
            ) : (
              /* LOBBY */
              <div className="max-w-md w-full p-8 flex flex-col gap-8 z-10">
                {status === "auto-joining" ? (
                  <div className="flex flex-col items-center justify-center gap-6 text-center">
                    <div className="loader"></div>
                    <h2 className="text-2xl font-light">Joining Call...</h2>
                    <p className="text-gray-500">
                      Allow camera access when prompted
                    </p>
                  </div>
                ) : (
                  <>
                    <div className="space-y-2">
                      <h1 className="text-5xl font-bold tracking-tighter text-white">
                        Two-Person <br />
                        <span className="accent-text">Video Call</span>
                      </h1>
                      <p className="text-gray-500">Share your link to start</p>
                    </div>

                    <div className="space-y-6">
                      {/* Invite Block */}
                      <div className="bg-zinc-900 p-6 rounded-xl border border-zinc-800 relative overflow-hidden group">
                        <label className="text-xs text-accent-text uppercase tracking-wider block mb-3 font-bold">
                          Invite Someone
                        </label>
                        <div className="flex flex-col gap-3">
                          <p className="text-sm text-gray-400">
                            Send this magic link to your friend. They will
                            auto-join when they click it.
                          </p>
                          <p className="text-xs text-yellow-600 bg-yellow-900/20 p-2 rounded border border-yellow-800">
                            ⚠️ Testing on same device? Use different browsers (Chrome + Firefox) or send link to another person.
                          </p>
                          <button
                            onClick={copyInviteLink}
                            className={`w-full py-3 px-4 rounded font-mono text-sm border transition-all flex items-center justify-center gap-2 ${
                              copySuccess
                                ? "bg-green-900/30 border-green-500 text-green-400"
                                : "bg-black border-zinc-700 hover:border-gray-500"
                            }`}
                          >
                            {copySuccess ? (
                              <i data-lucide="check" size={16} />
                            ) : (
                              <i data-lucide="link" size={16} />
                            )}
                            {copySuccess ? "Copied!" : "Copy Invite Link"}
                          </button>
                        </div>
                      </div>

                      {/* Manual Join Block (Optional) */}
                      <div className="space-y-4 pt-4 border-t border-zinc-800">
                        <p className="text-xs text-gray-600 text-center uppercase tracking-widest">
                          Or join manually
                        </p>
                        <div className="flex gap-2">
                          <input
                            type="text"
                            placeholder="Enter their ID"
                            value={remoteIdInput}
                            onChange={(e) => setRemoteIdInput(e.target.value)}
                            className="flex-1 bg-transparent border-b border-zinc-700 text-lg py-2 focus:outline-none focus:border-orange-500 transition-colors placeholder-zinc-800 font-mono"
                          />
                          <button
                            onClick={() => startCall()}
                            disabled={!remoteIdInput || status === "connecting"}
                            className="accent-bg hover:bg-orange-600 disabled:opacity-50 text-white px-6 rounded-lg font-bold transition-colors"
                          >
                            Join
                          </button>
                        </div>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        );
      };

      setTimeout(() => lucide.createIcons(), 100);
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
